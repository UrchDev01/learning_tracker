<li class="flex gap-3 py-3"><form method="post" action="{% url 'toggle_task' task.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.path }}"><button aria-label="Toggle {{ task.title }}" class="mt-0.5 flex h-5 w-5 items-center justify-center rounded border {% if task.completed %}border-emerald-600 bg-emerald-600 text-white{% else %}border-zinc-300 bg-white hover:border-indigo-500{% endif %}">{% if task.completed %}✓{% endif %}</button></form><div><p class="text-sm {% if task.completed %}text-zinc-400 line-through{% else %}font-medium text-zinc-800{% endif %}">{{ task.title }}</p>{% if task.description %}<p class="mt-1 text-xs leading-5 text-zinc-500">{{ task.description }}</p>{% endif %}</div></li>
