{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}AI Engineer OS{% endblock %}</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#18181b',accent:'#4f46e5'},boxShadow:{panel:'0 1px 2px rgb(0 0 0 / .04)'}}}}</script><style type="text/tailwindcss">@layer base{body{@apply bg-[#fafafa] text-zinc-900 antialiased;}input,textarea,select{@apply mt-1 block w-full rounded-md border-zinc-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100;}textarea{@apply min-h-32;}label{@apply text-sm font-medium text-zinc-700;}}@layer components{.page{@apply mx-auto max-w-6xl px-5 py-8 sm:px-8 lg:px-10 lg:py-10;}.eyebrow{@apply text-xs font-semibold uppercase tracking-[.16em] text-zinc-500;}.panel{@apply rounded-xl border border-zinc-200 bg-white shadow-panel;}.button-primary{@apply inline-flex items-center justify-center rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-700;}.button-secondary{@apply inline-flex items-center justify-center rounded-md border border-zinc-300 bg-white px-4 py-2 text-sm font-medium text-zinc-700 transition hover:bg-zinc-50;}}</style></head><body>{% if user.is_authenticated %}<button id="menu-button" class="fixed right-4 top-4 z-30 rounded-md border border-zinc-200 bg-white p-2 text-zinc-700 shadow-sm lg:hidden" aria-label="Open navigation"><svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>{% include "components/sidebar.html" %}{% endif %}<main class="min-h-screen {% if user.is_authenticated %}lg:pl-64{% endif %}">{% block content %}{% endblock %}</main><script>const b=document.getElementById('menu-button'),s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');if(b){b.onclick=()=>{s.classList.toggle('-translate-x-full');o.classList.toggle('hidden')};o.onclick=()=>{s.classList.add('-translate-x-full');o.classList.add('hidden')}}</script></body></html>
